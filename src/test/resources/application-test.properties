# Test Configuration
# JWT Configuration for tests
jwt.secret=bGV0cmFzeXBhcGVsZXNTZWNyZXRLZXlXaXRoQXRMZWFzdDI1NkJpdHNUb0JlU2VjdXJlRW5vdWdoRm9ySE1BQ1NIQTI1NkFsZ29yaXRobQ==
jwt.expiration=86400000

# H2 Test Database Configuration - Use random database name to avoid conflicts
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Disable H2 Console in tests
spring.h2.console.enabled=false

# Logging configuration for tests
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.letrasypapeles.backend=INFO
